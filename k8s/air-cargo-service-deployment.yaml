apiVersion: apps/v1
kind: Deployment
metadata:
  name: air-cargo-service
  namespace: dhl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: air-cargo-service
  template:
    metadata:
      labels:
        app: air-cargo-service
    spec:
      containers:
        - name: air-cargo-service
          image: docker.io/dataquaintacademy/dhl-air-cargo-service:latest
          ports:
            - containerPort: 5003
          env:
            - name: PORT
              value: "5003"
---
apiVersion: v1
kind: Service
metadata:
  name: air-cargo-service
  namespace: dhl
spec:
  selector:
    app: air-cargo-service
  ports:
    - port: 5003
      targetPort: 5003
  type: ClusterIP
